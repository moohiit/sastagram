# Keeps the Render free-tier sites awake: free services spin down after
# ~15 minutes without inbound traffic, so this pings their /healthz
# endpoints every 10 minutes.
#
# Window: 03:00-14:50 UTC = ~08:30-20:30 IST. Render's free plan shares
# 750 instance-hours/month across the workspace; two services awake
# ~12h/day (~710h total) fits, where two 24/7 services (~1440h) would
# not. Outside the window both sites sleep and cold-start on first visit.
#
# This lives in the sastagram repo (the active one) because GitHub
# disables scheduled workflows after 60 days without repo activity.
name: Keep Render sites awake

# GitHub throttles/skips busy cron slots (:00, :10, ...) — off-peak minutes
# fire far more reliably. This cron is only the morning alarm clock: the
# backend's own KEEP_ALIVE_URLS loop keeps both sites awake once woken, so a
# single successful run per day is enough.
on:
  schedule:
    - cron: "7,17,27,37,47,57 3-14 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping sastagram
        run: |
          curl -fsS --max-time 90 --retry 3 --retry-delay 10 \
            https://sastagram.mohitpatel.org/healthz
          echo "sastagram is awake."
      - name: Ping shopease
        if: always() # one site being down must not stop the other's ping
        run: |
          curl -fsS --max-time 90 --retry 3 --retry-delay 10 \
            https://shopease.mohitpatel.org/healthz
          echo "shopease is awake."
